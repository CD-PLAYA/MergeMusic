name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e ".[tags,dev]"
      - name: Fingerprint tool
        run: python -m mergemusic fpcalc --download
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          # the real-MusicBrainz test runs once, on macOS
          MERGEMUSIC_NETWORK_TESTS: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: python -m pytest -v
